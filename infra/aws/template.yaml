AWSTemplateFormatVersion: "2010-09-09"
Description: PETER PAN portfolio demo stack — single EC2, private services, HTTPS ingress only.

Parameters:
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues: [t3.large, t3.xlarge]
  KeyName:
    Type: String
    Default: ""
    Description: Optional SSH key (prefer SSM Session Manager)
  EnableBedrock:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Optional Stage C Bedrock invocation permission
  AllowedIngressCidr:
    Type: String
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/32$"
    ConstraintDescription: Enter one public IPv4 host as a /32 CIDR.
    Description: HTTPS source address for the controlled demo, as your public IP /32
  AllowedServiceIngressCidr:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/32$"
    Description: Optional dev IP /32 for service ports 8001-8008, 3000, 5678 (defaults to AllowedIngressCidr)
  N8nCloudEgressCidr:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/32$"
    Description: Optional n8n Cloud egress /32 for outbound webhook callbacks to the instance

Rules:
  RejectPublicIngress:
    Assertions:
      - Assert: !Not [!Equals [!Ref AllowedIngressCidr, 0.0.0.0/0]]
        AssertDescription: AllowedIngressCidr must not expose the demo to the internet.

Conditions:
  HasKey: !Not [!Equals [!Ref KeyName, ""]]
  BedrockEnabled: !Equals [!Ref EnableBedrock, "true"]
  HasServiceIngress: !Not [!Equals [!Ref AllowedServiceIngressCidr, ""]]
  HasN8nEgress: !Not [!Equals [!Ref N8nCloudEgressCidr, ""]]

Resources:
  PeterPanVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: peter-pan-demo

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PeterPanVpc
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref PeterPanVpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref PeterPanVpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !If [BedrockEnabled, !Ref BedrockInvokePolicy, !Ref AWS::NoValue]

  BedrockInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: BedrockEnabled
    Properties:
      Description: Invoke only Anthropic foundation models for the controlled demo
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.claude*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PETER PAN demo - restricted ingress (never 0.0.0.0/0)
      VpcId: !Ref PeterPanVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
          Description: Restricted HTTPS demo ingress
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !If [HasServiceIngress, !Ref AllowedServiceIngressCidr, !Ref AllowedIngressCidr]
          Description: Grafana (dev IP only)
        - IpProtocol: tcp
          FromPort: 5678
          ToPort: 5678
          CidrIp: !If [HasServiceIngress, !Ref AllowedServiceIngressCidr, !Ref AllowedIngressCidr]
          Description: n8n UI (dev IP only)
        - IpProtocol: tcp
          FromPort: 8001
          ToPort: 8008
          CidrIp: !If [HasServiceIngress, !Ref AllowedServiceIngressCidr, !Ref AllowedIngressCidr]
          Description: Layer 3 services (dev IP only)
        - !If
          - HasN8nEgress
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: !Ref N8nCloudEgressCidr
            Description: n8n Cloud egress for webhook callbacks
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS package, image, and model API access
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 10.42.0.0/16
          Description: DNS resolution inside the demo VPC
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 10.42.0.0/16
          Description: DNS fallback inside the demo VPC

  PeterPanInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      EbsOptimized: true
      Monitoring: true
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: peter-pan-demo
        - Key: project
          Value: peter-pan
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker git
          systemctl enable --now docker
          usermod -aG docker ec2-user
          mkdir -p /opt/peter-pan
          echo "Clone repo and run docker compose on instance" > /opt/peter-pan/README.txt

Outputs:
  InstanceId:
    Value: !Ref PeterPanInstance
  VpcId:
    Value: !Ref PeterPanVpc
  ConnectHint:
    Value: Use SSM Session Manager; service ports 8001-8008 and Grafana :3000 restricted to AllowedServiceIngressCidr
