# PETER PAN CI stack — ephemeral fixture stack for the compose-backed E2E gate.
#
# Security posture
# ─────────────────
# • All token/secret values are generated per CI job and carry zero privilege
#   outside this container set.
# • No .env file is read and no usable credential fallback is tracked.
# • Network "peter-ci-net" is declared internal=true — containers cannot reach
#   the public internet, and no container ports are published to the host.
# • Bootstrap and the E2E harness run as one-shot containers on that network.
# • No volumes shared with the developer's persistent data (tools-audit, n8n-data
#   are scoped to this compose project and cleaned up after CI).
#
# Usage
# ─────
# docker compose -f docker-compose.ci.yml -p peter-pan-ci up -d --wait
# docker compose -f docker-compose.ci.yml -p peter-pan-ci \
#   --profile bootstrap run --rm n8n-bootstrap
# docker compose -f docker-compose.ci.yml -p peter-pan-ci down -v

name: peter-pan-ci

x-healthcheck: &healthz
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 15s

# Ephemeral CI credentials — generated by the workflow and required here.
x-ci-env: &ci-env
  PETER_SERVICES_TOKEN: ${PETER_CI_TOKEN:?Generate PETER_CI_TOKEN for this CI run}
  PETER_WEBHOOK_SECRET: ${PETER_CI_SECRET:?Generate PETER_CI_SECRET for this CI run}
  PETER_RUNTIME_MODE: ci

services:
  # ── fixture-llm ───────────────────────────────────────────────────────────
  fixture-llm:
    build: services/fixture-llm
    networks: [peter-ci-net]
    environment:
      <<: *ci-env
    healthcheck:
      <<: *healthz
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]

  # ── integration-stubs ─────────────────────────────────────────────────────
  integration-stubs:
    build: services/integration-stubs
    networks: [peter-ci-net]
    environment:
      <<: *ci-env
      PETER_GITHUB_REPO: demo/shop-platform
    healthcheck:
      <<: *healthz
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]

  # ── tools-api ─────────────────────────────────────────────────────────────
  tools-api:
    build: services/tools-api
    networks: [peter-ci-net]
    environment:
      <<: *ci-env
      TOOLS_AUDIT_DB: /tmp/audit-ci.sqlite
      PETER_ENABLE_LIVE_DISPATCH: "false"
    healthcheck:
      <<: *healthz
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]

  # ── guardrails ────────────────────────────────────────────────────────────
  guardrails:
    build: services/guardrails
    networks: [peter-ci-net]
    environment:
      <<: *ci-env
      PETER_TOOLS_URL: http://tools-api:8000
    depends_on:
      tools-api:
        condition: service_healthy
    healthcheck:
      <<: *healthz
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]

  # ── predictor ─────────────────────────────────────────────────────────────
  predictor:
    build: services/predictor
    networks: [peter-ci-net]
    environment:
      <<: *ci-env
    healthcheck:
      <<: *healthz
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]

  # ── rag ───────────────────────────────────────────────────────────────────
  rag:
    build: services/rag
    networks: [peter-ci-net]
    environment:
      <<: *ci-env
      PETER_VECTOR_BACKEND: tfidf
    healthcheck:
      <<: *healthz
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]

  # ── langgraph-agent ───────────────────────────────────────────────────────
  langgraph-agent:
    build: services/langgraph-agent
    networks: [peter-ci-net]
    environment:
      <<: *ci-env
      PETER_RAG_URL: http://rag:8000
      PETER_TOOLS_URL: http://tools-api:8000
    depends_on:
      rag:
        condition: service_healthy
      tools-api:
        condition: service_healthy
    healthcheck:
      <<: *healthz
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]

  # ── n8n ───────────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:2.29.10
    networks: [peter-ci-net]
    healthcheck:
      <<: *healthz
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5678/healthz | grep -q ok"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      # WEBHOOK_URL: internal container address — ingestion reaches n8n via container name
      WEBHOOK_URL: http://n8n:5678/
      GENERIC_TIMEZONE: UTC
      # Ephemeral CI values — no real keys, no external auth
      N8N_ENCRYPTION_KEY: ${PETER_N8N_ENC_KEY:?Generate PETER_N8N_ENC_KEY for this CI run}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${PETER_N8N_JWT_SECRET:?Generate PETER_N8N_JWT_SECRET for this CI run}
      N8N_OWNER_EMAIL: ${PETER_N8N_EMAIL:-admin@ci.peter}
      N8N_OWNER_PASSWORD: ${PETER_N8N_PASSWORD:?Generate PETER_N8N_PASSWORD for this CI run}
      N8N_OWNER_FIRST_NAME: PETER
      N8N_OWNER_LAST_NAME: CI
      # Service URLs — all internal container names
      PETER_GUARDRAILS_URL: http://guardrails:8000
      PETER_PREDICTOR_URL: http://predictor:8000
      PETER_RAG_URL: http://rag:8000
      PETER_LANGGRAPH_URL: http://langgraph-agent:8000
      PETER_TOOLS_URL: http://tools-api:8000
      PETER_REVIEW_QUEUE_URL: http://integration-stubs:8000/review-queue
      PETER_DB_TEAM_WEBHOOK: http://integration-stubs:8000/teams/database
      PETER_INFRA_TEAM_WEBHOOK: http://integration-stubs:8000/teams/infra
      PETER_APP_TEAM_WEBHOOK: http://integration-stubs:8000/teams/application
      PETER_TRIAGE_TEAM_WEBHOOK: http://integration-stubs:8000/teams/triage
      PETER_SLACK_STUB_URL: http://integration-stubs:8000/slack
      PETER_GITHUB_API: http://integration-stubs:8000
      PETER_GITHUB_REPO: demo/shop-platform
      PETER_FIXTURE_LLM_URL: http://fixture-llm:8000/v1
    volumes:
      - n8n-ci-data:/home/node/.n8n
      - ./n8n/peter-flow.json:/import/peter-flow.json:ro
    depends_on:
      guardrails:
        condition: service_healthy
      predictor:
        condition: service_healthy
      rag:
        condition: service_healthy
      langgraph-agent:
        condition: service_healthy
      tools-api:
        condition: service_healthy
      fixture-llm:
        condition: service_healthy
      integration-stubs:
        condition: service_healthy

  # ── ingestion ─────────────────────────────────────────────────────────────
  # Comes last: depends on n8n being started (not necessarily healthy — n8n
  # takes a while to register the webhook after bootstrap).
  ingestion:
    build: services/ingestion
    networks: [peter-ci-net]
    environment:
      <<: *ci-env
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/peter-signal
    depends_on:
      n8n:
        condition: service_started
      guardrails:
        condition: service_healthy
    healthcheck:
      <<: *healthz
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]

  # ── n8n-bootstrap ─────────────────────────────────────────────────────────
  # Profile "bootstrap" — run once after the stack is healthy to import the
  # workflow, wire credentials, and publish the webhook. Uses the same
  # bootstrap Dockerfile as the dev stack.
  #
  # N8N_BASE_URL uses the internal network; bootstrap calls authenticated n8n
  # REST endpoints and does not mount the Docker socket.
  n8n-bootstrap:
    build:
      context: .
      dockerfile: scripts/n8n-bootstrap/Dockerfile
    restart: "no"
    profiles: ["bootstrap"]
    working_dir: /workspace
    networks: [peter-ci-net]
    volumes:
      - .:/workspace:ro
      - ./evaluation/results:/results
    environment:
      N8N_BASE_URL: http://n8n:5678
      N8N_BOOTSTRAP_CLI_IMPORT: "0"
      N8N_OWNER_EMAIL: ${PETER_N8N_EMAIL:-admin@ci.peter}
      N8N_OWNER_PASSWORD: ${PETER_N8N_PASSWORD:?Generate PETER_N8N_PASSWORD for this CI run}
      PETER_SERVICES_TOKEN: ${PETER_CI_TOKEN:?Generate PETER_CI_TOKEN for this CI run}
      PETER_WEBHOOK_SECRET: ${PETER_CI_SECRET:?Generate PETER_CI_SECRET for this CI run}
      PETER_FIXTURE_LLM_URL: http://fixture-llm:8000/v1
      PETER_FIXTURE_LLM_API_KEY: ${PETER_CI_TOKEN:?Generate PETER_CI_TOKEN for this CI run}
      PETER_EVALUATION_RESULTS_DIR: /results
      GITHUB_SHA: ${GITHUB_SHA:-}
    command: ["python", "scripts/bootstrap_n8n_local.py"]
    depends_on:
      n8n:
        condition: service_healthy

networks:
  peter-ci-net:
    driver: bridge
    # No ports are published. The bootstrap and E2E runner execute inside this
    # network, and internal=true blocks public internet egress.
    internal: true

volumes:
  n8n-ci-data:
    # Scoped to this compose project (peter-pan-ci) — will not conflict with
    # the developer's n8n-data volume and is cleaned up with `down -v`.
