# PETER PAN CI — lint + per-service test suites (services are self-contained
# import roots per BUILD_PLAN §2, so each suite runs from its own rootdir).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .

  test:
    name: pytest · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ingestion
          - predictor
          - rag
          - guardrails
          - tools-api
          - langgraph-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Run suite
        working-directory: services/${{ matrix.service }}
        run: pytest -q
