# Interim CI for the PETER PAN reset (cleanup/peter-pan-reset).
# Lint only: the legacy PITER test suites were removed and the migrated
# modules are not importable until Stage A re-packages them (see
# docs/adr/0001-piter-carryover.md). Stage A rebuilds per-service test jobs.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check .
